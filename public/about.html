<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta http-equiv="X-UA-Compatible" content="IE=edge" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>About DRAM!</title>
		<link rel="preconnect" href="https://fonts.googleapis.com">
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
		<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;1,100;1,200;1,300;1,400;1,500;1,600;1,700&display=swap" rel="stylesheet">
<!--this is more or less copied from sixey.es. thanks!-->		
		<style>
			html, body {
        	padding: 0;
            margin: 0;
            }

            body {
                background-position: center;
                background-attachment: fixed;
				background-image: url("https://dram.nekoweb.org/images/dredgeBGtile.PNG");
                font-family: "IBM Plex Mono", monospace;
                font-size: 16px;
            }

            .everything {
                display: grid;
                grid-template-columns: auto 153px;
                width: max-content;
                position: relative;
                z-index: 100;
            }

            .main {
                display: grid;
                width:850px;
                background-color: white;
                padding:10px;
                margin: 30px 0 30px 100px;
                column-gap: 10px;
                border: 5px solid midnightblue;
                /*border-image: url("_ui23/spring.png") 32 32 repeat; will replace lata*/
                position: relative;
            }

			.title {
				grid-column-start: 1;
				grid-column-end: 4;
			}
		</style>
	</head>
	
	<body>
		<div class="everything">
			<div class="main">
				<div class="title">
				<img src= "images/dramthedredgefinalLOGO.png">
				</div>
				
				<div>
				<p>Who Is DRAM?!</p>
				</div>
			</div>
		</div>
	</body>
</html>
